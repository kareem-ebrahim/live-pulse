<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// "Pulse" — a festival big-room track at 128 BPM, rendered offline with Web
// Audio: a huge kick, offbeat jump bass, supersaw chords and hook, formant
// vocal chops, crowd "HEY!" shouts, accelerating snare rolls, risers, a
// half-time wobble section, and the picture's sound effects on top.
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

window.renderAudio = async spec => {
  const SR = 48000
  const ctx = new OfflineAudioContext(2, Math.ceil(SR * spec.duration), SR)
  const BPM = spec.bpm
  const BEAT = 60 / BPM
  const BAR = BEAT * 4
  const S16 = BEAT / 4
  const bars = Math.ceil(spec.duration / BAR)

  // ── buses ─────────────────────────────────────────────────────────────────
  const limiter = ctx.createDynamicsCompressor()
  limiter.threshold.value = -6; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.08
  const master = ctx.createDynamicsCompressor()
  master.threshold.value = -12; master.knee.value = 8; master.ratio.value = 2.5; master.attack.value = 0.005; master.release.value = 0.15
  master.connect(limiter).connect(ctx.destination)
  const pump = ctx.createGain(); pump.connect(master)
  const music = ctx.createGain(); music.connect(pump)
  const drums = ctx.createGain(); drums.connect(master)
  const sfx = ctx.createGain(); sfx.gain.value = 0.75; sfx.connect(master)
  const vox = ctx.createGain(); vox.gain.value = 0.9; vox.connect(pump)

  const impulse = (sec, decay) => {
    const b = ctx.createBuffer(2, SR * sec, SR)
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, decay) }
    return b
  }
  const verb = ctx.createConvolver(); verb.buffer = impulse(3, 3)
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.26
  verb.connect(verbOut).connect(pump)
  const delay = ctx.createDelay(2); delay.delayTime.value = BEAT * 0.75
  const fb = ctx.createGain(); fb.gain.value = 0.3
  const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 4500
  delay.connect(dlp).connect(fb).connect(delay)
  const dOut = ctx.createGain(); dOut.gain.value = 0.28; dlp.connect(dOut).connect(pump)

  const shaper = amount => {
    const ws = ctx.createWaveShaper(), n = 4096, c = new Float32Array(n)
    for (let i = 0; i < n; i++) { const x = (i / n) * 2 - 1; c[i] = ((1 + amount) * x) / (1 + amount * Math.abs(x)) }
    ws.curve = c; ws.oversample = '4x'; return ws
  }
  const noiseBuf = (() => { const b = ctx.createBuffer(1, SR * 2, SR); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b })()
  const noise = (t, dur) => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t, Math.random()); s.stop(t + dur); return s }
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d) }
  const panner = v => { const p = ctx.createStereoPanner(); p.pan.value = clamp(v, -1, 1); return p }
  const note = n => 440 * Math.pow(2, (n - 69) / 12)
  const at = (bar, beat = 0) => bar * BAR + beat * BEAT

  // ── drums ─────────────────────────────────────────────────────────────────
  const kickBus = ctx.createGain(); kickBus.gain.value = 1.0
  const kickSat = shaper(9)
  kickSat.connect(kickBus).connect(drums)
  function kick(t, v = 1, duck = true) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.06); o.frequency.exponentialRampToValueAtTime(40, t + 0.45)
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1.0 * v, t + 0.002); g.gain.setValueAtTime(1.0 * v, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5)
    o.connect(g).connect(kickSat); o.start(t); o.stop(t + 0.55)
    const c = noise(t, 0.025), hp = ctx.createBiquadFilter(), cg = ctx.createGain()
    hp.type = 'highpass'; hp.frequency.value = 2000; env(cg, t, 0.0005, 0.5 * v, 0.02)
    c.connect(hp).connect(cg).connect(drums)
    if (duck) { pump.gain.setValueAtTime(0.08, t); pump.gain.linearRampToValueAtTime(1, t + BEAT * 0.7) }
  }
  function clap(t, v = 1) {
    for (const off of [0, 0.009, 0.019, 0.03]) {
      const s = noise(t + off, 0.3), bp = ctx.createBiquadFilter(), g = ctx.createGain()
      bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.7
      env(g, t + off, 0.001, (off === 0.03 ? 0.6 : 0.4) * v, off === 0.03 ? 0.25 : 0.02)
      s.connect(bp).connect(g).connect(drums); g.connect(verb)
    }
  }
  function snare(t, v = 1, pitch = 0) {
    const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'triangle'
    o.frequency.setValueAtTime(220 * Math.pow(2, pitch / 12), t); o.frequency.exponentialRampToValueAtTime(150 * Math.pow(2, pitch / 12), t + 0.07)
    env(og, t, 0.001, 0.3 * v, 0.1); o.connect(og).connect(drums); o.start(t); o.stop(t + 0.15)
    const s = noise(t, 0.2), hp = ctx.createBiquadFilter(), g = ctx.createGain()
    hp.type = 'highpass'; hp.frequency.value = 1500 + pitch * 80
    env(g, t, 0.001, 0.45 * v, 0.14)
    s.connect(hp).connect(g).connect(drums); g.connect(verb)
  }
  function hat(t, v = 1, open = false, pan = 0.25) {
    const s = noise(t, open ? 0.4 : 0.05), hp = ctx.createBiquadFilter(), g = ctx.createGain()
    hp.type = 'highpass'; hp.frequency.value = open ? 7000 : 9500
    env(g, t, 0.001, (open ? 0.22 : 0.15) * v, open ? 0.3 : 0.03)
    s.connect(hp).connect(g).connect(panner(pan)).connect(drums)
  }
  function crash(t, v = 1) {
    const s = noise(t, 3), hp = ctx.createBiquadFilter(), g = ctx.createGain()
    hp.type = 'highpass'; hp.frequency.value = 4500
    env(g, t, 0.002, 0.35 * v, 2.6)
    s.connect(hp).connect(g).connect(drums); g.connect(verb)
  }
  function reverseCrash(tEnd, len = 1) {
    const t = tEnd - len
    const s = noise(t, len), hp = ctx.createBiquadFilter(), g = ctx.createGain()
    hp.type = 'highpass'; hp.frequency.value = 4000
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, tEnd - 0.01); g.gain.linearRampToValueAtTime(0, tEnd)
    s.connect(hp).connect(g).connect(drums); g.connect(verb)
  }
  // the build-up roll: eighths, then sixteenths, then thirty-seconds, pitching up
  function roll(t0, t1) {
    const len = t1 - t0
    let t = t0
    while (t < t1 - 0.005) {
      const p = (t - t0) / len
      snare(t, 0.3 + 0.7 * p, p * 12)
      t += p < 0.5 ? BEAT / 2 : p < 0.75 ? BEAT / 4 : BEAT / 8
    }
  }

  // ── tonal ─────────────────────────────────────────────────────────────────
  // F#m – D – A – E : the euphoric festival loop
  const PROG = [[66, 69, 73], [62, 66, 69], [57, 61, 64], [64, 68, 71]]
  const ROOT = [42, 38, 45, 40]
  function supersaw(t, n, len, v = 1, cutoff = 6000, dest = music, wet = true) {
    const lp = ctx.createBiquadFilter(), g = ctx.createGain()
    lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 0.8
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045 * v, t + 0.008); g.gain.setValueAtTime(0.045 * v, t + Math.max(0.01, len - 0.02)); g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.1)
    lp.connect(g); g.connect(dest); if (wet) { g.connect(verb); g.connect(delay) }
    for (const det of [-28, -17, -8, 0, 8, 17, 28]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = note(n); o.detune.value = det
      o.connect(panner(det / 30)).connect(lp); o.start(t); o.stop(t + len + 0.12)
    }
  }
  const bassSat = shaper(4)
  const bassBus = ctx.createGain(); bassBus.gain.value = 0.6; bassSat.connect(bassBus).connect(music)
  // the jump bass: a fat stab on every offbeat eighth
  function jumpBass(t, root, v = 1, open = 1) {
    for (const off of [0.5, 1.5, 2.5, 3.5]) {
      const ts = t + off * BEAT
      const lp = ctx.createBiquadFilter(), g = ctx.createGain()
      lp.type = 'lowpass'; lp.Q.value = 5
      lp.frequency.setValueAtTime(400 + 3200 * open, ts); lp.frequency.exponentialRampToValueAtTime(300, ts + BEAT * 0.4)
      env(g, ts, 0.003, 0.5 * v, BEAT * 0.42)
      lp.connect(g).connect(bassSat)
      for (const [n, det] of [[root - 12, -10], [root - 12, 10], [root, 0]]) {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = note(n); o.detune.value = det
        o.connect(lp); o.start(ts); o.stop(ts + BEAT * 0.5)
      }
      const sub = ctx.createOscillator(), sg = ctx.createGain(); sub.type = 'sine'; sub.frequency.value = note(root - 24)
      env(sg, ts, 0.004, 0.45 * v, BEAT * 0.4); sub.connect(sg).connect(music); sub.start(ts); sub.stop(ts + BEAT * 0.5)
    }
  }
  // a wobble bass for the half-time section
  function wobble(t, root, len, rate) {
    const lp = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lfoG = ctx.createGain()
    lp.type = 'lowpass'; lp.Q.value = 9; lp.frequency.value = 900
    lfo.frequency.value = rate; lfoG.gain.value = 800; lfo.connect(lfoG).connect(lp.frequency)
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.3, t + 0.01); g.gain.setValueAtTime(0.3, t + len - 0.03); g.gain.linearRampToValueAtTime(0.0001, t + len)
    lp.connect(g).connect(bassSat)
    for (const [n, det, type] of [[root - 12, -8, 'sawtooth'], [root - 12, 8, 'square'], [root - 24, 0, 'sawtooth']]) {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = note(n); o.detune.value = det
      o.connect(lp); o.start(t); o.stop(t + len)
    }
    lfo.start(t); lfo.stop(t + len)
  }
  function pluck(t, n, v = 1, pan = 0) {
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain()
    o.type = 'square'; o.frequency.value = note(n)
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(7000, t); lp.frequency.exponentialRampToValueAtTime(800, t + 0.15)
    env(g, t, 0.001, 0.05 * v, 0.16)
    o.connect(lp).connect(g).connect(panner(pan)); g.connect(music); g.connect(delay)
    o.start(t); o.stop(t + 0.2)
  }
  // the hook: two bars that a crowd can shout
  const HOOK = [[0, 78, 0.5], [0.5, 78, 0.5], [1, 81, 0.75], [1.75, 78, 0.25], [2, 76, 0.5], [2.5, 73, 0.5], [3, 76, 1],
                [4, 73, 0.5], [4.5, 73, 0.5], [5, 76, 0.75], [5.75, 73, 0.25], [6, 71, 0.5], [6.5, 69, 0.5], [7, 71, 1]]
  function hook(t, v = 1, octave = true) {
    for (const [b, n, len] of HOOK) {
      supersaw(t + b * BEAT, n, len * BEAT - 0.02, 1.6 * v, 9000)
      if (octave) supersaw(t + b * BEAT, n + 12, len * BEAT - 0.02, 0.7 * v, 9000)
    }
  }
  function screech(t, n, len, v = 1) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain()
    o.type = 'square'; o2.type = 'sawtooth'
    o.frequency.setValueAtTime(note(n - 5), t); o.frequency.exponentialRampToValueAtTime(note(n), t + 0.06)
    o2.frequency.setValueAtTime(note(n - 5) * 1.005, t); o2.frequency.exponentialRampToValueAtTime(note(n) * 1.005, t + 0.06)
    lp.type = 'bandpass'; lp.Q.value = 3; lp.frequency.setValueAtTime(1200, t); lp.frequency.exponentialRampToValueAtTime(4200, t + len)
    env(g, t, 0.004, 0.12 * v, len)
    o.connect(lp); o2.connect(lp); lp.connect(shaper(5)).connect(g).connect(music); g.connect(delay)
    o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05)
  }
  function chords(t, chord, len, v = 1, cutoff = 5000) {
    for (const n of [...chord, chord[0] - 12]) supersaw(t, n, len, 0.75 * v, cutoff)
  }

  // ── voices: formant chops and crowd shouts ────────────────────────────────
  const VOWEL = { ah: [800, 1150, 2900], oh: [450, 800, 2830], ee: [300, 2300, 3000], eh: [550, 1850, 2500] }
  function voice(t, n, len, vowel = 'ah', v = 1, pan = 0, dest = vox) {
    const src = ctx.createOscillator(), src2 = ctx.createOscillator()
    src.type = 'sawtooth'; src2.type = 'sawtooth'
    src.frequency.value = note(n); src2.frequency.value = note(n); src2.detune.value = 9
    const vib = ctx.createOscillator(), vibG = ctx.createGain(); vib.frequency.value = 5.5; vibG.gain.value = note(n) * 0.012
    vib.connect(vibG).connect(src.frequency); vibG.connect(src2.frequency)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5 * v, t + 0.015); g.gain.setValueAtTime(0.5 * v, t + Math.max(0.02, len - 0.04)); g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.05)
    const mixG = ctx.createGain(); mixG.gain.value = 1
    for (const [i, f] of VOWEL[vowel].entries()) {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 8 + i * 4
      const bg = ctx.createGain(); bg.gain.value = [1, 0.6, 0.35][i]
      src.connect(bp); src2.connect(bp); bp.connect(bg).connect(mixG)
    }
    mixG.connect(g).connect(panner(pan)).connect(dest); g.connect(verb); g.connect(delay)
    for (const o of [src, src2, vib]) { o.start(t); o.stop(t + len + 0.1) }
  }
  // a crowd shouting "HEY!": many voices, a little apart, with breath noise
  function hey(t, v = 1) {
    for (let k = 0; k < 9; k++) {
      const n = 52 + (k % 5) * 2 + (k > 6 ? 12 : 0)
      const off = Math.random() * 0.03
      voice(t + off, n, 0.2, 'eh', 0.55 * v, (k / 8) * 2 - 1, sfx)
    }
    const s = noise(t, 0.25), bp = ctx.createBiquadFilter(), g = ctx.createGain()
    bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1
    env(g, t, 0.005, 0.25 * v, 0.2); s.connect(bp).connect(g).connect(sfx); g.connect(verb)
  }
  const CHOPS = [[0, 78, 'oh'], [0.75, 76, 'ah'], [1.5, 73, 'ee'], [2, 76, 'ah'], [2.5, 78, 'oh'], [3.25, 81, 'ah'],
                 [4, 73, 'oh'], [4.75, 71, 'ah'], [5.5, 69, 'ee'], [6, 71, 'ah'], [6.75, 73, 'oh']]
  function chops(t, v = 1) {
    for (const [b, n, vw] of CHOPS) voice(t + b * BEAT, n, BEAT * 0.45, vw, 0.9 * v, b % 2 ? 0.25 : -0.25)
  }

  function riser(t, len, v = 1) {
    const s = noise(t, len), bp = ctx.createBiquadFilter(), g = ctx.createGain()
    bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.setValueAtTime(250, t); bp.frequency.exponentialRampToValueAtTime(11000, t + len)
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35 * v, t + len)
    s.connect(bp).connect(g).connect(master); g.connect(verb)
    for (const det of [-12, 0, 12]) {
      const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sawtooth'; o.detune.value = det
      o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(2200, t + len)
      og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.035 * v, t + len)
      const olp = ctx.createBiquadFilter(); olp.type = 'lowpass'; olp.frequency.value = 5000
      o.connect(olp).connect(og).connect(master); o.start(t); o.stop(t + len)
    }
  }
  function subDrop(t, v = 1) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.frequency.setValueAtTime(80, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.6)
    env(g, t, 0.003, 0.9 * v, 1.8)
    o.connect(shaper(2)).connect(g).connect(master); o.start(t); o.stop(t + 2)
  }

  // ── the picture's sound effects ───────────────────────────────────────────
  function impact(t, v = 1) { subDrop(t, v); crash(t, v) }
  function whoosh(t, len = 0.6, v = 1, dir = 1) {
    const s = noise(t, len), bp = ctx.createBiquadFilter(), g = ctx.createGain(), p = ctx.createStereoPanner()
    bp.type = 'bandpass'; bp.Q.value = 1.2
    bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(4500, t + len * 0.55); bp.frequency.exponentialRampToValueAtTime(500, t + len)
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.42 * v, t + len * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + len)
    p.pan.setValueAtTime(-0.85 * dir, t); p.pan.linearRampToValueAtTime(0.85 * dir, t + len)
    s.connect(bp).connect(g).connect(p).connect(sfx)
  }
  const PENTA = [66, 69, 71, 73, 76, 78, 81]
  function blip(t, i = 0, v = 1, pan = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = 'sine'; o.frequency.value = note(PENTA[i % PENTA.length] + 12)
    env(g, t, 0.002, 0.05 * v, 0.07)
    o.connect(g).connect(panner(pan)).connect(sfx); o.start(t); o.stop(t + 0.1)
  }
  function pop(t, v = 1, pan = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = 'sine'; o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(1500, t + 0.08)
    env(g, t, 0.002, 0.3 * v, 0.15); o.connect(g).connect(panner(pan)).connect(sfx); o.start(t); o.stop(t + 0.2)
  }
  function error(t) {
    for (const [off, n] of [[0, 52], [0.13, 46]]) {
      const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain()
      o.type = 'square'; o.frequency.value = note(n); lp.type = 'lowpass'; lp.frequency.value = 1400
      env(g, t + off, 0.003, 0.15, 0.2); o.connect(lp).connect(g).connect(sfx); o.start(t + off); o.stop(t + off + 0.25)
    }
  }
  function success(t) {
    for (const [off, n] of [[0, 78], [0.07, 83], [0.14, 90]]) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = note(n)
      env(g, t + off, 0.003, 0.15, 0.5); o.connect(g).connect(sfx); g.connect(verb); o.start(t + off); o.stop(t + off + 0.55)
    }
  }
  function typing(t0, t1) {
    for (let t = t0; t < t1; t += 0.05 + Math.random() * 0.06) {
      const s = noise(t, 0.02), hp = ctx.createBiquadFilter(), g = ctx.createGain()
      hp.type = 'highpass'; hp.frequency.value = 2500 + Math.random() * 2500
      env(g, t, 0.001, 0.08 + Math.random() * 0.05, 0.014); s.connect(hp).connect(g).connect(sfx)
    }
  }
  function zap(t) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = 'sawtooth'; o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.35)
    env(g, t, 0.003, 0.14, 0.35); o.connect(g).connect(sfx); g.connect(verb); o.start(t); o.stop(t + 0.4)
  }
  function tick(t, v = 1) {
    const s = noise(t, 0.012), hp = ctx.createBiquadFilter(), g = ctx.createGain()
    hp.type = 'highpass'; hp.frequency.value = 5000; env(g, t, 0.0005, 0.2 * v, 0.01); s.connect(hp).connect(g).connect(sfx)
  }
  function alarm(t) {
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sawtooth'
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200
      o.frequency.setValueAtTime(note(78), t + i * 0.24); o.frequency.setValueAtTime(note(73), t + i * 0.24 + 0.12)
      env(g, t + i * 0.24, 0.004, 0.09, 0.22); o.connect(lp).connect(g).connect(sfx); o.start(t + i * 0.24); o.stop(t + i * 0.24 + 0.28)
    }
  }

  // ── the arrangement, by bar ───────────────────────────────────────────────
  // A: intro build · B: drop 1 · C: lift · D: drop 2 (screech + chops)
  // E: half-time wobble · F: big build · G: final drop · H: tail
  const S = spec.form
  const kindOf = bar => (S.find(s => bar >= s.from && bar < s.to) ?? { kind: 'none' })
  if (!spec.noMusic) {
    for (let bar = 0; bar < bars; bar++) {
      const sec = kindOf(bar)
      const k = sec.kind
      const t = at(bar)
      const ci = bar % 4
      const chord = PROG[ci]
      const p = (bar - sec.from + 0.0001) / Math.max(1, sec.to - sec.from)
      if (k === 'none') continue
      const isDrop = k === 'drop1' || k === 'drop2' || k === 'final'

      if (k === 'intro') {
        // a build from the first second: filtered chords, a quickening kick, the roll and HEYs
        chords(t, chord, BAR, 0.3 + p * 0.5, 400 + p * p * 3000)
        for (let b = 0; b < 4; b++) { if (bar >= 1) kick(at(bar, b), 0.35 + p * 0.35, false); hat(at(bar, b + 0.5), 0.15 + p * 0.5) }
        continue
      }
      if (k === 'tail') {
        if (bar === sec.from) { chords(t, PROG[0], BAR * 1.5, 1.2, 3200); voice(t, 78, BAR * 1.2, 'ah', 0.8) }
        continue
      }
      if (k === 'lift' || k === 'build') {
        // the riser section: chords swell, kick then claps quicken, the roll runs to the drop
        chords(t, chord, BAR, 0.7 + 0.3 * p, 1200 + 5000 * p)
        for (let b = 0; b < 4; b++) {
          if (k === 'build' && p < 0.5 && b % 2 === 0) kick(at(bar, b), 0.8, false)
          if (k === 'build' && p >= 0.5) kick(at(bar, b), 0.85, false)
          hat(at(bar, b + 0.5), 0.6)
          for (let s = 0; s < 4; s++) pluck(at(bar, b + s / 4), chord[(b * 4 + s) % 3] + 12, 0.6 + 0.4 * p, s % 2 ? 0.3 : -0.3)
        }
        continue
      }
      if (k === 'halftime') {
        // heavy half-time: kick on 1, snare on 3, rattling hats, a wobble bass
        kick(t, 1); snare(at(bar, 2), 1); clap(at(bar, 2), 0.7)
        for (let s = 0; s < 16; s++) hat(at(bar, s / 4), s % 4 === 2 ? 0.8 : 0.45)
        for (let s = 0; s < 8; s++) if (s % 2 === 1 && bar % 2 === 1) hat(at(bar, 3 + s / 8), 0.5)
        wobble(t, ROOT[ci], BAR / 2, BPM / 60 * 2)
        wobble(t + BAR / 2, ROOT[ci], BAR / 2, BPM / 60 * (bar % 2 ? 4 : 3))
        chords(t, chord, BAR, 0.3, 1800)
        continue
      }
      if (isDrop) {
        const big = k === 'final' ? 1.15 : 1
        for (let b = 0; b < 4; b++) {
          kick(at(bar, b), big)
          if (b === 1 || b === 3) { clap(at(bar, b), big); snare(at(bar, b), 0.5) }
          hat(at(bar, b + 0.5), 0.9, true)
          for (let s = 0; s < 4; s++) hat(at(bar, b + s / 4), s === 2 ? 0.6 : 0.35, false, -0.2)
        }
        jumpBass(t, ROOT[ci], big, 1)
        chords(t, chord, BAR, 0.65 * big, 7000)
        if (bar % 2 === 0) hook(t, big, k !== 'drop1' || bar % 4 === 0)
        if (k === 'drop2' && bar % 2 === 1) { chops(at(bar - 1), 1); for (let s = 0; s < 4; s++) screech(at(bar, s), chord[s % 3] + 12, BEAT * 0.4, 0.8) }
        if (k === 'final' && bar % 2 === 1) chops(at(bar - 1), 0.8)
      }
    }
    // transitions: crashes on every section start, rolls and HEYs into every drop, a breath before it
    for (const s of S) {
      if (s.kind !== 'intro') crash(at(s.from), 0.9)
      if (['drop1', 'drop2', 'final'].includes(s.kind)) {
        const end = at(s.from)
        const prev = S.find(x => x.to === s.from)
        if (prev && (prev.kind === 'intro' || prev.kind === 'build' || prev.kind === 'lift')) {
          roll(end - BAR * (prev.kind === 'build' ? 2 : 1), end - BEAT * 0.5)
          riser(end - BAR * (prev.kind === 'build' ? 4 : 2), BAR * (prev.kind === 'build' ? 4 : 2) - BEAT * 0.5, 1.2)
          reverseCrash(end, BEAT * 1.5)
          hey(end - BEAT * 2, 1); hey(end - BEAT * 1, 1.1)
        } else { reverseCrash(end, BEAT); hey(end - BEAT, 0.9) }
        subDrop(end, 1)
      }
      if (s.kind === 'halftime') subDrop(at(s.from), 0.9)
    }
  }

  for (const c of spec.cues) {
    switch (c.kind) {
      case 'impact': impact(c.t, c.v ?? 1); break
      case 'whoosh': whoosh(c.t, c.len ?? 0.6, c.v ?? 1, c.dir ?? 1); break
      case 'blip': blip(c.t, c.i ?? 0, c.v ?? 1, c.pan ?? 0); break
      case 'pop': pop(c.t, c.v ?? 1, c.pan ?? 0); break
      case 'error': error(c.t); break
      case 'success': success(c.t); break
      case 'typing': typing(c.t, c.t + (c.len ?? 1)); break
      case 'zap': zap(c.t); break
      case 'tick': tick(c.t, c.v ?? 1); break
      case 'alarm': alarm(c.t); break
      case 'riser': riser(c.t, c.len, c.v ?? 1); break
      case 'hey': hey(c.t, c.v ?? 1); break
    }
  }

  const buf = await ctx.startRendering()
  const L = buf.getChannelData(0), R = buf.getChannelData(1)
  let peak = 0
  for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]))
  const gain = peak > 0 ? 1 / peak : 1
  const n = L.length
  const ab = new ArrayBuffer(44 + n * 4)
  const dv = new DataView(ab)
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)))
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ')
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true)
  dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); str(36, 'data'); dv.setUint32(40, n * 4, true)
  const soft = x => Math.tanh(x * 1.15) / Math.tanh(1.15) * 0.95
  for (let i = 0, o = 44; i < n; i++, o += 4) {
    dv.setInt16(o, clamp(soft(L[i] * gain), -1, 1) * 32767, true)
    dv.setInt16(o + 2, clamp(soft(R[i] * gain), -1, 1) * 32767, true)
  }
  const bytes = new Uint8Array(ab)
  let s = ''
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
  return btoa(s)
}
